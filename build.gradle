plugins {
    id 'fabric-loom' version '1.15.4'
    id 'maven-publish'
}

version = '1.6.0'
group = 'dev.eymen.balancedshop'
base { archivesName = 'fabric-balanced-shop-1.21.11' }

repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'net.fabricmc:fabric-loader-junit:0.18.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (project.hasProperty('withCompat')) {
        modLocalRuntime fileTree(dir: '.tools/compat', include: '*.jar')
    }
}
loom {
    accessWidenerPath = file('src/main/resources/balancedshop.accesswidener')
    splitEnvironmentSourceSets()
    mods {
        balancedshop {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java { withSourcesJar() }
test { useJUnitPlatform() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'balancedshop-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = false
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
