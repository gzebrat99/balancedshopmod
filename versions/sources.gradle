                        if(src.name=='ForgeClient.java') {
                            content=content.readLines().collect { line -> line.contains('TickEvent.ClientTickEvent') ? '        net.minecraftforge.common.MinecraftForge.EVENT_BUS.addListener((TickEvent.ClientTickEvent e)->{if(e.phase==TickEvent.Phase.END)ClientBridge.ClientTickEvents.END_CLIENT_TICK.listeners.forEach(l->l.accept(Minecraft.getInstance()));});' : line }.join('\n')
                            content=content.replace('p->ForgeNetwork.CHANNEL.send(new ForgeNetwork.ToServer(p),Minecraft.getInstance().getConnection().getConnection())', 'p->ForgeNetwork.CHANNEL.sendToServer(new ForgeNetwork.ToServer(p))')
