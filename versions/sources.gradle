                        content=content.replace('public ForgeEntrypoint(FMLJavaModLoadingContext context){', 'public ForgeEntrypoint(){\n        var context=FMLJavaModLoadingContext.get();')
                        if(src.name=='ForgeEntrypoint.java')content=content.replace('group.addListener((RegisterEvent e)->{', 'group.addListener((RegisterEvent e)->{dev.eymen.balancedshop.legacy.NativeRegistrations.EVENT.set(e);')
