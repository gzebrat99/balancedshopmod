                    def oldFile=generated.get().file('resources/'+oldPath).asFile
                    def newFile=generated.get().file('resources/'+newPath).asFile
                    newFile.parentFile.mkdirs();newFile.setText(oldFile.getText('UTF-8'),'UTF-8');oldFile.delete()
                }
            }
        }
        if(older('1.21.4')) {
            generated.get().file('resources/assets/balancedshop/models/item/uncrafting_table.json').asFile.setText('{"parent":"balancedshop:block/uncrafting_table"}','UTF-8')
            ['copper_coin','silver_coin','gold_coin','platinum_coin'].each { name ->
                def model=generated.get().file("resources/assets/balancedshop/models/item/${name}.json").asFile
                model.parentFile.mkdirs();model.setText('{"parent":"minecraft:item/generated","textures":{"layer0":"balancedshop:item/coin"}}','UTF-8')
            }
        }
        if(older('1.20.5')) {
            def mixin=generated.get().file('resources/balancedshop.mixins.json').asFile
            mixin.setText(mixin.getText('UTF-8').replace('JAVA_21','JAVA_17'),'UTF-8')
        }
        def metadata = new groovy.json.JsonSlurper().parse(generated.get().file('resources/fabric.mod.json').asFile)
        metadata.version = project.version.toString()
        if(!nativeLoader && mc=='1.20.1')metadata.description='Türkçe dinamik pazar, kalıcı ekonomi, büyü kitapları, ganimet depolu üreteçler ve çizgili alan yerleştirme.'
        metadata.depends.minecraft = mc
        metadata.depends.fabricloader = ">=${target.fabricLoader}"
        metadata.depends.java = ">=${target.java}"
        metadata.depends['fabric-api'] = ">=${target.fabricApi.tokenize('+')[0]}"
        generated.get().file('resources/fabric.mod.json').asFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)),'UTF-8')
        if(nativeLoader) {
            generated.get().file('resources/fabric.mod.json').asFile.delete()
            generated.get().file('resources/balancedshop.accesswidener').asFile.delete()
            copy { from "${root}/ports/shared/src/main/resources", "${root}/ports/${loader}/src/main/resources"; into generated.get().dir('resources') }
            def path = loader=='forge' ? 'META-INF/mods.toml' : 'META-INF/neoforge.mods.toml'
            def toml=generated.get().file('resources/'+path).asFile
            String text=toml.getText('UTF-8').replace('${version}',project.version.toString()).replace('[1.21.11]',"[${mc}]")
            text=text.replace(loader=='forge' ? '[61.2.0,)' : '[21.11.45,)', "[${target[loader]},)")
            if(loader=='forge')text=text.replace('[61,)', "[${target.forge.tokenize('.')[0]},)")
            if(target.neoforgeLegacy && project.name.contains('neoforge'))text=text.replace('Forge Balanced Shop','NeoForge Balanced Shop').replace("[${target.forge},)",'[47.1.106,)')
            toml.setText(text,'UTF-8')
            if(loader=='forge') {
                generated.get().file('resources/pack.mcmeta').asFile.setText(mc=='1.20.1' ? '{"pack":{"description":"Balanced Shop","pack_format":15}}' : '{"pack":{"description":"Balanced Shop","pack_format":34,"supported_formats":[34,48]}}','UTF-8')
            }
            if(older('1.20.5')) ['balancedshop.mixins.json','balancedshop.ports.mixins.json'].each { pathName ->
                def mixin=generated.get().file('resources/'+pathName).asFile
                def json=new groovy.json.JsonSlurper().parse(mixin);json.compatibilityLevel='JAVA_17';json.refmap='balancedshop.refmap.json'
                mixin.setText(groovy.json.JsonOutput.toJson(json),'UTF-8')
            }
            if(mc=='1.20.1' && !project.name.contains('neoforge')) {
                def retired=generated.get().file('resources/balancedshop.mixins.json').asFile
                def settings=new groovy.json.JsonSlurper().parse(retired)
                settings.mixins.remove('CreateVillagerMixin')
                retired.setText(groovy.json.JsonOutput.toJson(settings),'UTF-8')
            }
        }
    }
}
sourceSets.main.java.setSrcDirs([generated.map { it.dir('main') }])
if(!nativeLoader) sourceSets.client.java.setSrcDirs([generated.map { it.dir('client') }])
sourceSets.main.resources.setSrcDirs([generated.map { it.dir('resources') }])
def generationTasks=['compileJava','processResources','sourcesJar']
if(!nativeLoader) generationTasks.add('compileClientJava')
generationTasks.each { taskName -> tasks.named(taskName) { dependsOn 'generateVersionSources' } }
tasks.named('jar'){exclude 'dev/eymen/balancedshop/verification/**'}
