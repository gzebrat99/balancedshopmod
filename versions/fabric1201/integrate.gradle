    edit('placement/PlacementClient'){t->
        t=t.readLines().findAll{!it.startsWith('import net.minecraftforge.')}.join('\n')
        t=region(t,'    public static void install(','    private static void preview(','''    public static void install(){
        net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper.registerKeyBinding(MENU);
        net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents.END_CLIENT_TICK.register(client->{
            while(MENU.consumeClick())if(client.player!=null&&client.screen==null)client.setScreen(new PlacementScreen());
            if(client.screen!=null||client.player==null||!client.options.keyUse.isDown())useWasDown=false;
            if(client.player==null)disable();
        });
        net.fabricmc.fabric.api.client.rendering.v1.WorldRenderEvents.LAST.register(PlacementClient::preview);
        net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback.EVENT.register((graphics,partial)->{
            var client=Minecraft.getInstance();
            if(enabled&&client.screen==null&&client.player!=null&&client.player.getMainHandItem().getItem() instanceof BlockItem)
                graphics.drawCenteredString(client.font,"Alan: "+size+"×"+size+" · Sağ tık: yerleştir · "+MENU.getTranslatedKeyMessage().getString()+": boyut / kapat",client.getWindow().getGuiScaledWidth()/2,client.getWindow().getGuiScaledHeight()-65,0xE8C46E);
        });
    }
    public static boolean tryUse(){
        var client=Minecraft.getInstance();
        if(client.screen!=null||client.player==null||!enabled||!(client.player.getMainHandItem().getItem() instanceof BlockItem))return false;
        if(!useWasDown&&client.hitResult instanceof BlockHitResult hit&&hit.getType()==HitResult.Type.BLOCK){
            AreaPlacement.CHANNEL.sendToServer(new AreaPlacement.Request(size));useWasDown=true;
        }
        return true;
    }
