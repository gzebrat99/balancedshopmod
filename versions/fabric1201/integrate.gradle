        if(!player.mayBuild()||player.isSpectator())return InteractionResult.FAIL;
        if(level instanceof ServerLevel server&&player instanceof ServerPlayer p){
            if(!server.mayInteract(p,hit.getBlockPos())||!storage(spawner).stillValid(p))return InteractionResult.FAIL;
            p.openMenu(new SimpleMenuProvider((id,inv,owner)->new StorageMenu(id,inv,storage(spawner)),Component.literal("Üreteç Deposu · 4 saniye")));
        }
        return InteractionResult.SUCCESS;
    }
