        .replace('ServerLifecycleEvents.SERVER_STARTED.register(ServerVerification::verify);', '''net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents.END_SERVER_TICK.register(server->{
            if(attempted||BalancedShop.catalogue()==null)return;
            var level=server.overworld();var fixture=new net.minecraft.core.BlockPos(180,90,180);
