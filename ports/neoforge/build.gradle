plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
apply from: '../common.gradle'
base { archivesName = 'neoforge-balanced-shop-1.21.11' }
neoForge {
    version = '21.11.45'
    runs {
        client { client(); gameDirectory = project.file('run/client'); if(project.hasProperty('verify')) systemProperty 'balancedshop.verify','true' }
        server { server(); gameDirectory = project.file('run/server'); programArgument '--nogui' }
    }
    mods { balancedshop { sourceSet sourceSets.main } }
}
